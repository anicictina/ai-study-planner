spring.application.name=backend
spring.profiles.active=local

spring.datasource.url=jdbc:postgresql://localhost:5432/ai_study_planner
spring.datasource.username=${DB_USERNAME:ai_study_planner}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8080

app.jwt.secret=${JWT_SECRET:change-this-dev-only-secret-key-please-override-in-prod-32chars-min}
app.jwt.expiration-ms=86400000

app.cors.allowed-origins=http://localhost:4200

gemini.api.key=${GEMINI_API_KEY:}
gemini.model=gemini-3.6-flash
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/${gemini.model}:generateContent

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=${spring.mail.username}
app.frontend-url=${FRONTEND_URL:http://localhost:4200}

