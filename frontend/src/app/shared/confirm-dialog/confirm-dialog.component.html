<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">{{ data.cancelLabel ?? 'Otkaži' }}</button>
  <button mat-flat-button [color]="data.danger ? 'warn' : 'primary'" (click)="confirm()">
    {{ data.confirmLabel ?? 'Potvrdi' }}
  </button>
</mat-dialog-actions>
