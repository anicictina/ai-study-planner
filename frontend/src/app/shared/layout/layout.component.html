<mat-toolbar color="primary" class="toolbar">
  <a routerLink="/dashboard" class="brand">
    <mat-icon>school</mat-icon>
    <span>AI Study Planner</span>
  </a>

  <nav class="nav-links">
    <a mat-button routerLink="/dashboard" routerLinkActive="active-link">Početna</a>
    <a mat-button routerLink="/subjects" routerLinkActive="active-link">Predmeti</a>
    <a mat-button routerLink="/exams" routerLinkActive="active-link">Ispiti</a>
    <a mat-button routerLink="/study-sessions" routerLinkActive="active-link">Sesije</a>
    <a mat-button routerLink="/calendar" routerLinkActive="active-link">Kalendar</a>
  </nav>

  <span class="spacer"></span>

  @if (currentUser(); as user) {
    <button mat-button [matMenuTriggerFor]="userMenu" class="user-button">
      <mat-icon>account_circle</mat-icon>
      {{ user.firstName }} {{ user.lastName }}
    </button>
    <mat-menu #userMenu="matMenu">
      <button mat-menu-item routerLink="/profile">
        <mat-icon>settings</mat-icon>
        <span>Profil</span>
      </button>
      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Odjava</span>
      </button>
    </mat-menu>
  }
</mat-toolbar>

<main class="content">
  <router-outlet />
</main>
